[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pax-q80-hackkit"
version = "0.1.0"
description = "Development and recovery tools for PAX Q80"
requires-python = ">=3.11"

[project.optional-dependencies]
screenshot = ["Pillow>=10"]

[project.scripts]
q80 = "q80.cli:main"

[tool.setuptools.packages.find]
include = ["q80*"]
